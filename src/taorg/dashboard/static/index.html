<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TAORG Dashboard</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%232563eb' stroke-width='2.2'%3E%3Ccircle cx='5' cy='12' r='2.5'/%3E%3Ccircle cx='19' cy='6' r='2.5'/%3E%3Ccircle cx='19' cy='18' r='2.5'/%3E%3Cpath d='M7.3 11 16.7 7M7.3 13l9.4 4' stroke-dasharray='2 2'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="/static/app.css">
</head>
<body>
  <a class="skip" href="#main">Skip to content</a>
  <div class="shell">
    <aside class="sidebar" id="sidebar" aria-label="Main navigation">
      <div class="brand">
        <svg class="brand-mark" viewBox="0 0 24 24" aria-hidden="true"><circle cx="5" cy="12" r="2.5"/><circle cx="19" cy="6" r="2.5"/><circle cx="19" cy="18" r="2.5"/><path d="M7.3 11 16.7 7M7.3 13l9.4 4" stroke-dasharray="2 2"/></svg>
        <div>
          <div class="brand-name">TAORG</div>
          <div class="brand-sub">V-HPED edge filtering</div>
        </div>
      </div>
      <nav>
        <a href="#/overview" data-route="overview"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="9" rx="1"/><rect x="14" y="3" width="7" height="5" rx="1"/><rect x="14" y="12" width="7" height="9" rx="1"/><rect x="3" y="16" width="7" height="5" rx="1"/></svg>Overview</a>
        <a href="#/explorer" data-route="explorer"><svg viewBox="0 0 24 24"><path d="M22 12h-4l-3 9L9 3l-3 9H2"/></svg>Filter explorer</a>
        <div class="nav-group">Evaluation</div>
        <a href="#/results" data-route="results"><svg viewBox="0 0 24 24"><path d="M3 3v18h18"/><path d="M7 15l4-4 3 3 5-6"/></svg>Ablation results</a>
        <a href="#/efficiency" data-route="efficiency"><svg viewBox="0 0 24 24"><path d="M12 14l4-4"/><path d="M3.3 19a9 9 0 1 1 17.4 0"/></svg>Lazy efficiency</a>
        <a href="#/identifiability" data-route="identifiability"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1"/></svg>Identifiability</a>
        <div class="nav-group">Data</div>
        <a href="#/runs" data-route="runs"><svg viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/><path d="M12 7v5l4 2"/></svg>Run history</a>
      </nav>
      <div class="sidebar-foot">
        <span class="dot dot-amber"></span>All results are synthetic
      </div>
    </aside>
    <div class="scrim" id="scrim" hidden></div>
    <div class="main-col">
      <header class="topbar">
        <button class="icon-btn menu-btn" id="menuBtn" aria-label="Open navigation" aria-controls="sidebar" aria-expanded="false">
          <svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
        </button>
        <div class="title-wrap">
          <h1 id="pageTitle">Overview</h1>
          <p id="pageSub" class="muted"></p>
        </div>
        <div class="status" id="apiStatus" role="status"><span class="dot"></span><span>Connecting…</span></div>
      </header>
      <main id="main" tabindex="-1"></main>
    </div>
  </div>
  <div class="tooltip" id="tooltip" role="tooltip" hidden></div>
  <script src="/static/charts.js"></script>
  <script src="/static/app.js"></script>
</body>
</html>
