conditions:
  C0_oracle:
    role: h1_primary
    description: Occlusion gaps only; perfect visibility signal (oracle).
    gaps:
    - 1
    - 2
    - 3
    - 5
    - 10
    - 20
    calibrate: true
  R1_visnoise_0.2:
    role: h1_robustness
    description: Occlusion gaps + symmetric visibility-flag noise (20% of absence
      frames mislabelled).
    gaps:
    - 1
    - 2
    - 3
    - 5
    - 10
    - 20
    calibrate: true
    visibility_noise:
      occluded_to_visible_prob: 0.2
      visible_to_occluded_prob: 0.2
  R2_flicker_0.1:
    role: h1_robustness
    description: Occlusion gaps + base-model flicker (10% of visible alive frames
      missed, still VISIBLE).
    gaps:
    - 1
    - 2
    - 3
    - 5
    - 10
    - 20
    calibrate: true
    flicker_miss_prob: 0.1
  SWV_0.1:
    role: sweep
    description: Visibility-noise sweep point.
    gaps:
    - 1
    - 2
    - 3
    - 5
    - 10
    - 20
    calibrate: true
    visibility_noise:
      occluded_to_visible_prob: 0.1
      visible_to_occluded_prob: 0.1
    sweep_axis: visibility_noise
    sweep_value: 0.1
  SWV_0.3:
    role: sweep
    description: Visibility-noise sweep point.
    gaps:
    - 1
    - 2
    - 3
    - 5
    - 10
    - 20
    calibrate: true
    visibility_noise:
      occluded_to_visible_prob: 0.3
      visible_to_occluded_prob: 0.3
    sweep_axis: visibility_noise
    sweep_value: 0.3
  SWV_0.5:
    role: sweep
    description: Visibility-noise sweep point (flag carries no information).
    gaps:
    - 1
    - 2
    - 3
    - 5
    - 10
    - 20
    calibrate: true
    visibility_noise:
      occluded_to_visible_prob: 0.5
      visible_to_occluded_prob: 0.5
    sweep_axis: visibility_noise
    sweep_value: 0.5
  SWF_0.05:
    role: sweep
    description: Flicker sweep point.
    gaps:
    - 1
    - 2
    - 3
    - 5
    - 10
    - 20
    calibrate: true
    flicker_miss_prob: 0.05
    sweep_axis: flicker
    sweep_value: 0.05
  SWF_0.2:
    role: sweep
    description: Flicker sweep point.
    gaps:
    - 1
    - 2
    - 3
    - 5
    - 10
    - 20
    calibrate: true
    flicker_miss_prob: 0.2
    sweep_axis: flicker
    sweep_value: 0.2
  SWF_0.3:
    role: sweep
    description: Flicker sweep point.
    gaps:
    - 1
    - 2
    - 3
    - 5
    - 10
    - 20
    calibrate: true
    flicker_miss_prob: 0.3
    sweep_axis: flicker
    sweep_value: 0.3
  S1_termination_under_occlusion:
    role: stress
    description: Every terminating edge's object is OCCLUDED for 15-40 frames right
      after termination.
    gaps:
    - 1
    - 2
    - 3
    - 5
    - 10
    - 20
    tuned_on: C0_oracle
    world_overrides:
      termination_occlusion_prob: 1.0
  S2_id_switch_d5:
    role: stress
    description: No occlusion; two same-class ID swaps of 5 frames.
    gaps:
    - 0
    tuned_on: C0_oracle
    id_switch:
      swap_duration: 5
      num_swaps: 2
      require_same_class: true
      min_pre_swap_frames: 2
      min_post_swap_frames: 2
  S2_id_switch_d20:
    role: stress
    description: No occlusion; two same-class ID swaps of 20 frames.
    gaps:
    - 0
    tuned_on: C0_oracle
    id_switch:
      swap_duration: 20
      num_swaps: 2
      require_same_class: true
      min_pre_swap_frames: 2
      min_post_swap_frames: 2
  S3_repeated_occlusion:
    role: stress
    description: Three independently placed gaps per edge (may overlap; union is evaluated).
    gaps:
    - 3
    - 10
    tuned_on: C0_oracle
    occlusion_overrides:
      num_gaps_per_edge: 3
  S4_unknown_all:
    role: stress
    description: Every absence record reports UNKNOWN visibility.
    gaps:
    - 1
    - 2
    - 3
    - 5
    - 10
    - 20
    tuned_on: C0_oracle
    visibility_noise:
      to_unknown_prob: 1.0
  S4_unknown_half:
    role: stress
    description: Half of absence records report UNKNOWN visibility.
    gaps:
    - 1
    - 2
    - 3
    - 5
    - 10
    - 20
    tuned_on: C0_oracle
    visibility_noise:
      to_unknown_prob: 0.5
  S5_long_absence:
    role: stress
    description: Long occlusions (1 s and 2 s) followed by visibility returning.
    gaps:
    - 30
    - 60
    tuned_on: C0_oracle
