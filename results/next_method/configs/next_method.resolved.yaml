prior:
  horizon_s: 3.0
  fit_split: calibration
  fit_conditions: calibrated (C1-C7)
search:
  n_samples: 200
  enumerated: {}
  base_spaces:
    gated:
      alpha:
      - uniform
      - 0.1
      - 1.0
      decay_visible:
      - uniform
      - 0.0
      - 0.95
      decay_occluded:
      - one_minus_loguniform
      - 0.001
      - 0.3
      decay_unknown:
      - uniform
      - 0.0
      - 0.999
      score_threshold:
      - loguniform
      - 0.01
      - 0.6
  extension_spaces:
    hysteresis:
      off_ratio:
      - uniform
      - 0.1
      - 0.95
    runpost:
      tau:
      - uniform
      - 0.05
      - 0.95
      kappa:
      - loguniform
      - 1.0
      - 1000.0
    buffer:
      n_occ:
      - uniform
      - 0.0
      - 90.0
      n_unk:
      - uniform
      - 0.0
      - 90.0
  methods:
    gated_ema_hyst:
    - gated
    - - hysteresis
    b2_hold_km:
    - gated
    - - hysteresis
      - runpost
    b2_hold_static:
    - gated
    - - hysteresis
      - runpost
    b2_hold_pooled:
    - gated
    - - hysteresis
      - runpost
    b2_hold_geometric:
    - gated
    - - hysteresis
      - runpost
    b2_hold_buffer:
    - gated
    - - hysteresis
      - buffer
methods_order:
- gated_ema_hyst
- b2_hold_buffer
- b2_hold_geometric
- b2_hold_static
- b2_hold_pooled
- b2_hold_km
prior_methods:
