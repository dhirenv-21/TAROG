[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "taorg"
version = "0.1.0"
description = "TAORG — Temporal Adaptive Object Relationship Graph with V-HPED"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}

dependencies = [
    "torch>=2.0",
    "numpy>=1.24",
    "pyyaml>=6.0",
    "matplotlib>=3.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "ruff>=0.4",
    "httpx>=0.24",  # FastAPI TestClient in tests/integration/test_dashboard.py
]
# Optional web dashboard over saved runs (scripts/run_dashboard.py).
dashboard = [
    "fastapi>=0.100",
    "uvicorn>=0.20",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"taorg.dashboard" = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP"]
