# Phase 8 ablation matrix — SYNTHETIC scenario (src/taorg/experiments/ablation_matrix.py).
# Not paper evidence on its own; rerun on real predictions once Phase 6/7 data exist.
# Run: python scripts/run_ablation_matrix.py --workers 5

seeds: [42, 123, 456, 789, 2024]          # predeclared (configs/corruption/defaults.yaml)
splits: {train: 20, val: 10, test: 20}    # videos per seed
scenario: {}                              # ScenarioConfig defaults (vhped_benchmark.py)

conditions:
  occlusion_flicker: {}
  occlusion_flicker_idswitch:
    id_switch: {swap_duration: 5, num_swaps: 2, min_pre_swap_frames: 2,
                min_post_swap_frames: 2, require_same_class: true}

thresholds: [0.02, 0.05, 0.1, 0.15, 0.2, 0.25, 0.3, 0.35, 0.4, 0.45, 0.5,
             0.55, 0.6, 0.65, 0.7, 0.75, 0.8, 0.85, 0.9, 0.95]

trainer: {num_iters: 200, lr: 0.05, l2_cross: 1.0e-3, fit_rebirth: false}

# Phase 8 comparison list.  Baseline params mirror configs/temporal/baselines.yaml.
methods:
  no_memory:          {method: no_memory}
  fixed_window:       {method: fixed_window, window_size: 5}
  ema:                {method: ema, alpha: 0.3, decay: 0.9}
  gated_ema:          {method: gated_ema, alpha: 0.3, decay_visible: 0.7, decay_occluded: 0.95, decay_unknown: -1.0}
  hmm:                {method: hmm, stay_alive_prob: 0.9, resurrect_prob: 0.01, emit_obs_alive: 0.9, emit_obs_dead: 0.05, prior_alive: 0.5}
  vhped_handset:      {method: vhped}
  vt_hmm_fit:         {method: vhped, fit: true, trainer: {use_excitation: false}}
  vhped_novis_fit:    {method: vhped, fit: true, trainer: {use_visibility: false}}
  vhped_self_fit:     {method: vhped, fit: true, trainer: {use_cross_predicate: false}}
  vhped_full_fit:     {method: vhped, fit: true}
  vhped_lazyexact_fit: {method: vhped_lazy, fit: true, trainer: {fit_gamma: false, rho_unk_fixed: 0.0}}

reference_method: vhped_full_fit
bootstrap: {n: 10000, seed: 0}
