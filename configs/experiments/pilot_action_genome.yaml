# Phase 3 go/no-go pilot on Action Genome (GT relations + synthetic occlusion).
# Protocol: src/taorg/experiments/pilot.py.  Run:
#   python scripts/run_pilot_ag.py --config configs/experiments/pilot_action_genome.yaml
# Everything that changes results lives here (Rules §3).  Seeds are predeclared:
# do not drop or rerun individual seeds (Rules §6).

dataset: action_genome
dataset_config: configs/datasets/action_genome.yaml
temporal_method: pilot_sweep        # many methods; see `methods`
seed: 42                            # = first of `seeds`; required by config validation

seeds: [42, 123, 456, 789, 2024]    # same predeclared set as configs/corruption/defaults.yaml
split_seed: 0                       # fit/val split of AG train videos (fixed across seeds)
val_fraction: 0.1

occlusion:                          # configs/corruption/defaults.yaml values
  gap_lengths: [1, 2, 3, 5, 10, 20] # in ANNOTATED frames (AG keyframes are sparse)
  num_gaps_per_edge: 1
  max_edges: null
  min_pre_gap_frames: 2
  min_post_gap_frames: 2

thresholds: [0.02, 0.05, 0.1, 0.15, 0.2, 0.25, 0.3, 0.35, 0.4, 0.45, 0.5,
             0.55, 0.6, 0.65, 0.7, 0.75, 0.8, 0.85, 0.9, 0.95]

# V-HPED shared settings: hand-set parameters (copied from configs/temporal/vhped.yaml;
# num_predicates is taken from the dataset vocabulary at run time).
vhped:
  mu: 5.0
  alpha_self: 7.0
  alpha_cross: 0.0
  eta: -0.5
  gamma_self: 0.0
  gamma_cross: 0.0
  beta_vis: 3.0
  beta_occ: 0.3
  beta_unk: 1.0
  rho_occ: 0.05
  rho_unk: 0.5
  eps_rate: 1.0
  rebirth_rate: 0.0
  prior_alive: 0.5
  use_marks: true
  fps: 30.0
  prune_below: 1.0e-6

training:
  max_videos: 2000                  # fit subset of AG train (null = all fit videos)
  trainer:
    num_iters: 200
    lr: 0.05
    l2_cross: 1.0e-3
    fit_rebirth: false

# Method name -> spec.  Baseline params mirror configs/temporal/baselines.yaml;
# thresholds are swept, so `score_threshold` is not set here.
methods:
  no_memory:       {method: no_memory}
  ema:             {method: ema, alpha: 0.3, decay: 0.9}
  gated_ema:       {method: gated_ema, alpha: 0.3, decay_visible: 0.7, decay_occluded: 0.95, decay_unknown: -1.0}
  hmm:             {method: hmm, stay_alive_prob: 0.9, resurrect_prob: 0.01, emit_obs_alive: 0.9, emit_obs_dead: 0.05, prior_alive: 0.5}
  vhped_handset:   {method: vhped}
  vt_hmm_fit:      {method: vhped, fit: true, use_excitation: false}
  vhped_novis_fit: {method: vhped, fit: true, use_visibility: false}
  vhped_self_fit:  {method: vhped, fit: true, use_cross_predicate: false}
  vhped_full_fit:  {method: vhped, fit: true}

# Hypervolume comparisons (a vs b) over all (seed, gap) cells.
# The first two are the Phase 3 go gate (H1); the rest map to H2/H3 ablations.
comparisons:
  - [gated_ema, ema]
  - [gated_ema, no_memory]
  - [vhped_full_fit, gated_ema]
  - [vhped_full_fit, vt_hmm_fit]
  - [vhped_full_fit, vhped_self_fit]
  - [vhped_full_fit, vhped_novis_fit]
  - [vhped_full_fit, vhped_handset]
