# Stage 7/9: IA-VHPED vs baselines and ablations (SYNTHETIC).
# Hypotheses HA1-HA4: research/stage3_direction_selection.md.  Run:
#   python scripts/run_ablation_matrix.py --config configs/experiments/ia_matrix_synthetic.yaml --workers 8
seeds: [42, 123, 456, 789, 2024]
splits: {train: 20, val: 10, test: 20}
scenario: {}

conditions:
  swaps0:            {identity_score: {informativeness: 1.0}}
  swaps2_k1:         {id_switch: {swap_duration: 5, num_swaps: 2, require_same_class: true},
                      identity_score: {informativeness: 1.0}}
  swaps2_k05:        {id_switch: {swap_duration: 5, num_swaps: 2, require_same_class: true},
                      identity_score: {informativeness: 0.5}}
  swaps2_k0:         {id_switch: {swap_duration: 5, num_swaps: 2, require_same_class: true},
                      identity_score: {informativeness: 0.0}}
  swaps4_k1:         {id_switch: {swap_duration: 5, num_swaps: 4, require_same_class: true},
                      identity_score: {informativeness: 1.0}}
  swaps4_k0:         {id_switch: {swap_duration: 5, num_swaps: 4, require_same_class: true},
                      identity_score: {informativeness: 0.0}}
  swaps2_k1_visflip: {id_switch: {swap_duration: 5, num_swaps: 2, require_same_class: true},
                      identity_score: {informativeness: 1.0}, vis_flip_prob: 0.1}
  swaps2_k1_jitter:  {id_switch: {swap_duration: 5, num_swaps: 2, require_same_class: true},
                      identity_score: {informativeness: 1.0}, timestamp_jitter: 0.5}

thresholds: [0.02, 0.05, 0.1, 0.15, 0.2, 0.25, 0.3, 0.35, 0.4, 0.45, 0.5,
             0.55, 0.6, 0.65, 0.7, 0.75, 0.8, 0.85, 0.9, 0.95]
trainer: {num_iters: 200, lr: 0.05, l2_cross: 1.0e-3, fit_rebirth: false}

methods:
  gated_ema:          {method: gated_ema, alpha: 0.3, decay_visible: 0.7, decay_occluded: 0.95, decay_unknown: -1.0}
  vhped_handset:      {method: vhped}
  vt_hmm_fit:         {method: vhped, fit: true, trainer: {use_excitation: false}}
  vhped_full_fit:     {method: vhped, fit: true}
  vhped_self_fit:     {method: vhped, fit: true, trainer: {use_cross_predicate: false}}
  vhped_fit_rhounk05: {method: vhped, fit: true, trainer: {rho_unk_fixed: 0.5}}   # diagnostic, not a method
  ia_full_fit:        {method: vhped_ia, fit: true}
  ia_nobirth_fit:     {method: vhped_ia, fit: true, ia: {identity_births: false}}
  ia_nopost_fit:      {method: vhped_ia, fit: true, ia: {posterior_weight: false}}
  ia_lazyexact_fit:   {method: vhped_ia_lazy, fit: true, trainer: {fit_gamma: false, rho_unk_fixed: 0.0}}

reference_method: ia_full_fit
bootstrap: {n: 10000, seed: 0}
