# Phase 5H Stage 0 — VidOR ground-truth Hawkes signal probe (see research/phase5h_stage0_preregistration.md)
data:
  root: data/vidor               # gitignored; annotations only
  train_dir: training
  test_dir: validation            # official validation split = untouched TEST
  md5:
    training-annotation.zip: 85f39fdd81a780bbb9b975cca8f219a2
    validation-annotation.zip: 96c6870910e8d4fb3836878215432c1f
splits:
  shuffle_seed: 5101
  dev_size: 1400
  fold_seed: 5102
