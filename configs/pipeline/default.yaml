# TAORG end-to-end pipeline configuration (docs/PIPELINE.md).
# Interpreters of the two pinned stage environments (docs/SETUP.md); override with
# TAORG_PY_PERCEPTION / TAORG_PY_EGTR.
python_perception: D:/TAORG_runs/appearance/venv/Scripts/python.exe
python_egtr: D:/TAORG_runs/egtr/venv/Scripts/python.exe
reid_weights: D:/TAORG_runs/appearance/weights/osnet_x1_0_msmt17.pt
flag_artifact: results/appearance/freeze/frozen_models.pkl   # frozen takeover flag (sha256-checked)
# Relationship layer (EGTR every 3rd frame). NOT A VALIDATED OPERATING POINT: the registered final
# evaluation stopped at its development gate (research/taorg_final_exit_report.md). tau_obs is the
# development 90th percentile of EGTR person-person triplet scores (results/final/dev/diagnosis.json);
# method parameters are illustrative defaults.
tau_obs: 6.648e-07
method: FB          # B2/VH need [0,1]-scaled scores; raw EGTR triplet scores (~1e-6) never reach their thresholds
use_flag: true
params:
  NM: {}
  FB: {window_size: 10}
  B2: {alpha: 0.3, decay_visible: 0.5, decay_occluded: 0.9, score_threshold: 0.3, off_ratio: 0.5}
  VH: {mu: 0.5, nu: 0.01, gamma_o: 0.5, gamma_v: 3.0, miss: 0.05, false_pos: 0.01, threshold: 0.5,
       r_ov: 0.05, r_vo: 0.05, dt_ref: 0.1}
